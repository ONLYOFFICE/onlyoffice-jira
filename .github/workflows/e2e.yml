name: E2E

on:
  workflow_dispatch:
    inputs:
      jira_version:
        description: 'atlassian/jira image tag (empty — "max" from atlassian-plugin-marketing.xml)'
        default: ''
      documentserver_image:
        description: 'Document Server image'
        default: 'onlyoffice/documentserver:latest'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '.check-licenses.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      jira_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Resolve Jira version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.jira_version }}
        run: |
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version=$(sed -n 's/.*<product name="jira"[^>]*max="\([^"]*\)".*/\1/p' \
              src/main/resources/atlassian-plugin-marketing.xml | head -n 1)
          fi
          if [ -z "$version" ]; then
            echo '::error file=src/main/resources/atlassian-plugin-marketing.xml::Could not read the "max" Jira version'
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Jira version: $version"

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Artifact
        run: |
          cd ${{ github.workspace }}
          cwd=$(pwd)
          sudo sh -c 'echo "deb https://packages.atlassian.com/debian/atlassian-sdk-deb/ stable contrib" >>/etc/apt/sources.list'
          wget https://packages.atlassian.com/api/gpg/key/public
          sudo apt-key add public
          sudo apt-get update -y
          sudo apt-get install atlassian-plugin-sdk -y
          atlas-version
          atlas-package

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: target/onlyoffice-jira-*.jar
          retention-days: 1
          if-no-files-found: error

  e2e:
    needs: build
    uses: ONLYOFFICE/integration-tests/.github/workflows/e2e.yml@develop
    with:
      system: jira
      artifact_name: plugin
      documentserver_image: ${{ inputs.documentserver_image || 'onlyoffice/documentserver:latest' }}
      env_overrides: JIRA_VERSION=${{ needs.build.outputs.jira_version }}
